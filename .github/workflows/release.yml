name: Release

# Builds the remote control card and attaches the integration as av_scenes.zip
# to the release; HACS installs that zip (zip_release in hacs.json).
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The tag is the version (also for pre-releases such as v0.7.0-beta.1)
      - name: Set the version from the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          for file in custom_components/av_scenes/manifest.json frontend/package.json; do
            jq --arg v "$version" '.version = $v' "$file" > "$file.tmp"
            mv "$file.tmp" "$file"
          done
          echo "Version $version"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the card
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Zip the integration
        working-directory: custom_components/av_scenes
        run: zip -r "$GITHUB_WORKSPACE/av_scenes.zip" . -x '__pycache__/*' '*/__pycache__/*'

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" av_scenes.zip --clobber
