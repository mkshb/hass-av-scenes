name: Release

# Builds the remote control card and attaches the integration as av_scenes.zip
# to the release; HACS installs that zip (zip_release in hacs.json).
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check that the version matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(jq -r .version custom_components/av_scenes/manifest.json)
          package=$(jq -r .version frontend/package.json)
          if [ "$tag" != "$manifest" ] || [ "$tag" != "$package" ]; then
            echo "Tag $tag, manifest.json $manifest, package.json $package differ"
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the card
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Zip the integration
        working-directory: custom_components/av_scenes
        run: zip -r "$GITHUB_WORKSPACE/av_scenes.zip" . -x '__pycache__/*' '*/__pycache__/*'

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" av_scenes.zip --clobber
